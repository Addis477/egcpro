<!-- Updated Add News Section with Image URL field -->
<div id="addNewsSection" style="display: none;">
  <h2>Create New News / Event Post</h2>
  <form id="newsForm">
    <div class="form-group">
      <label>Post Type *</label>
      <select id="newsType" required>
        <option value="announcement">📢 Announcement / News</option>
        <option value="event">🎉 Event (with date/location)</option>
      </select>
    </div>
    <div class="form-group">
      <label>Title *</label>
      <input type="text" id="newsTitle" required>
    </div>
    <div class="form-group">
      <label>Image URL (optional - paste image link)</label>
      <input type="text" id="newsImage" placeholder="https://images.unsplash.com/... or leave empty for auto">
      <small style="color: #888;">Tip: Use free images from Unsplash, Pexels, or placehold.co</small>
    </div>
    <div class="form-group" id="eventDateGroup" style="display: none;">
      <label>Event Date *</label>
      <input type="text" id="eventDate" placeholder="e.g., June 28, 2025">
    </div>
    <div class="form-group" id="eventTimeGroup" style="display: none;">
      <label>Event Time</label>
      <input type="text" id="eventTime" placeholder="e.g., 10:00 AM - 4:00 PM">
    </div>
    <div class="form-group" id="eventLocationGroup" style="display: none;">
      <label>Event Location</label>
      <input type="text" id="eventLocation" placeholder="e.g., Infront of British Embassy, Addis Ababa">
    </div>
    <div class="form-group">
      <label>Excerpt / Short Summary</label>
      <input type="text" id="newsExcerpt">
    </div>
    <div class="form-group">
      <label>Full Content * (HTML supported)</label>
      <textarea id="newsContent" rows="6" required></textarea>
    </div>
    <button type="submit" class="btn-gold"><i class="fas fa-paper-plane"></i> Publish Post</button>
  </form>
</div>

<script>
  // Show/hide event fields based on type selection
  document.getElementById('newsType')?.addEventListener('change', function() {
    const isEvent = this.value === 'event';
    document.getElementById('eventDateGroup').style.display = isEvent ? 'block' : 'none';
    document.getElementById('eventTimeGroup').style.display = isEvent ? 'block' : 'none';
    document.getElementById('eventLocationGroup').style.display = isEvent ? 'block' : 'none';
  });
  
  // Updated news form submission
  document.getElementById('newsForm')?.addEventListener('submit', function(e) {
    e.preventDefault();
    const isEvent = document.getElementById('newsType').value === 'event';
    const newPost = {
      id: Date.now(),
      title: document.getElementById('newsTitle').value,
      type: document.getElementById('newsType').value,
      image: document.getElementById('newsImage').value || null,
      excerpt: document.getElementById('newsExcerpt').value,
      content: document.getElementById('newsContent').value,
      date: new Date().toISOString()
    };
    
    if (isEvent) {
      newPost.eventDate = document.getElementById('eventDate').value;
      newPost.eventTime = document.getElementById('eventTime').value;
      newPost.eventLocation = document.getElementById('eventLocation').value;
    }
    
    let currentNews = JSON.parse(localStorage.getItem('egc_news') || '[]');
    currentNews.push(newPost);
    localStorage.setItem('egc_news', JSON.stringify(currentNews));
    
    alert('Post published successfully!');
    document.getElementById('newsForm').reset();
    // Refresh the manage news table
    location.reload();
  });
</script>

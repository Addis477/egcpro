<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EGC Global | Admin Dashboard</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --deep-teal: #0f1e24;
      --charcoal: #121418;
      --gold: #d4af5a;
      --gold-light: #e6c97e;
      --dark-bg: #0a0c0f;
      --card-bg: #1a1f24;
      --danger: #e74c3c;
      --success: #27ae60;
      --warning: #f39c12;
      --info: #3498db;
      --ivory: #f2ede4;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: var(--dark-bg);
      color: var(--ivory);
    }

    /* Top Bar */
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1rem 2rem;
      background: rgba(10, 12, 15, 0.95);
      border-bottom: 1px solid rgba(212, 175, 90, 0.3);
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .logo h1 {
      font-size: 1.5rem;
      background: linear-gradient(135deg, var(--gold-light), var(--gold));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }
    .logo p {
      font-size: 0.65rem;
      color: var(--gold);
    }
    .admin-welcome {
      display: flex;
      align-items: center;
      gap: 1.5rem;
    }
    .logout-btn {
      background: rgba(231, 76, 60, 0.2);
      color: var(--danger);
      padding: 0.5rem 1rem;
      border-radius: 30px;
      text-decoration: none;
      font-size: 0.85rem;
      border: 1px solid var(--danger);
      transition: 0.2s;
    }
    .logout-btn:hover {
      background: var(--danger);
      color: white;
    }

    /* Container */
    .container {
      max-width: 1400px;
      margin: 0 auto;
      padding: 2rem;
    }

    /* Stats Cards */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 1.5rem;
      margin-bottom: 2rem;
    }
    .stat-card {
      background: var(--card-bg);
      border-radius: 20px;
      padding: 1.5rem;
      text-align: center;
      border: 1px solid rgba(212, 175, 90, 0.2);
    }
    .stat-card i {
      font-size: 2.5rem;
      color: var(--gold);
    }
    .stat-number {
      font-size: 2.5rem;
      font-weight: bold;
      margin: 0.5rem 0;
    }

    /* Tabs */
    .tabs {
      display: flex;
      gap: 0.5rem;
      margin-bottom: 2rem;
      flex-wrap: wrap;
      border-bottom: 1px solid rgba(212, 175, 90, 0.2);
      padding-bottom: 0.5rem;
    }
    .tab-btn {
      background: transparent;
      border: none;
      color: var(--ivory);
      padding: 0.7rem 1.5rem;
      cursor: pointer;
      font-weight: 600;
      border-radius: 30px;
      transition: 0.2s;
    }
    .tab-btn.active {
      background: var(--gold);
      color: #000;
    }
    .tab-btn:hover:not(.active) {
      background: rgba(212, 175, 90, 0.2);
    }

    /* Tables */
    .data-table {
      width: 100%;
      border-collapse: collapse;
      background: var(--card-bg);
      border-radius: 16px;
      overflow: hidden;
    }
    .data-table th, .data-table td {
      padding: 1rem;
      text-align: left;
      border-bottom: 1px solid rgba(212, 175, 90, 0.1);
    }
    .data-table th {
      background: rgba(212, 175, 90, 0.15);
      color: var(--gold);
    }
    .status-pending {
      background: rgba(243, 156, 18, 0.2);
      color: var(--warning);
      padding: 0.2rem 0.6rem;
      border-radius: 20px;
      font-size: 0.75rem;
    }
    .status-approved {
      background: rgba(39, 174, 96, 0.2);
      color: var(--success);
      padding: 0.2rem 0.6rem;
      border-radius: 20px;
      font-size: 0.75rem;
    }
    .action-btn {
      background: none;
      border: none;
      cursor: pointer;
      margin: 0 5px;
      font-size: 1.1rem;
      padding: 0.3rem 0.6rem;
      border-radius: 8px;
      transition: 0.2s;
    }
    .btn-approve { color: var(--success); }
    .btn-delete { color: var(--danger); }
    .action-btn:hover { transform: scale(1.1); background: rgba(255,255,255,0.1); }

    /* Forms */
    .form-card {
      background: var(--card-bg);
      border-radius: 20px;
      padding: 2rem;
      border: 1px solid rgba(212, 175, 90, 0.2);
    }
    .form-group {
      margin-bottom: 1.2rem;
    }
    .form-group label {
      display: block;
      margin-bottom: 0.5rem;
      color: var(--gold-light);
      font-weight: 500;
    }
    .form-group input, .form-group select, .form-group textarea {
      width: 100%;
      padding: 0.8rem 1rem;
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(212, 175, 90, 0.3);
      border-radius: 12px;
      color: var(--ivory);
      font-size: 1rem;
    }
    .form-group input:focus, .form-group select:focus, .form-group textarea:focus {
      outline: none;
      border-color: var(--gold);
    }
    .btn-gold {
      background: var(--gold);
      color: #000;
      padding: 0.8rem 1.8rem;
      border: none;
      border-radius: 40px;
      font-weight: bold;
      cursor: pointer;
      transition: 0.2s;
    }
    .btn-gold:hover {
      background: var(--gold-light);
      transform: translateY(-2px);
    }
    .btn-outline {
      background: transparent;
      border: 1px solid var(--gold);
      color: var(--gold);
      padding: 0.8rem 1.8rem;
      border-radius: 40px;
      font-weight: bold;
      cursor: pointer;
    }

    /* Alert */
    .alert {
      padding: 1rem;
      border-radius: 12px;
      margin-bottom: 1rem;
    }
    .alert-success {
      background: rgba(39, 174, 96, 0.2);
      border-left: 4px solid var(--success);
    }
    .alert-error {
      background: rgba(231, 76, 60, 0.2);
      border-left: 4px solid var(--danger);
    }

    /* Section visibility */
    .section {
      display: none;
    }
    .section.active {
      display: block;
    }

    /* Responsive */
    @media (max-width: 768px) {
      .container { padding: 1rem; }
      .data-table th, .data-table td { padding: 0.5rem; font-size: 0.8rem; }
      .tabs { gap: 0.3rem; }
      .tab-btn { padding: 0.4rem 1rem; font-size: 0.8rem; }
    }
  </style>
</head>
<body>

<div class="top-bar">
  <div class="logo">
    <h1>EGC <span style="color:var(--gold);">Admin</span></h1>
    <p>DASHBOARD</p>
  </div>
  <div class="admin-welcome">
    <span><i class="fas fa-user-shield"></i> Welcome, Admin</span>
    <button class="logout-btn" onclick="logout()"><i class="fas fa-sign-out-alt"></i> Logout</button>
  </div>
</div>

<div class="container">
  <!-- Stats Cards -->
  <div class="stats-grid">
    <div class="stat-card">
      <i class="fas fa-users"></i>
      <div class="stat-number" id="pendingCount">0</div>
      <p>Pending Registrations</p>
    </div>
    <div class="stat-card">
      <i class="fas fa-check-circle"></i>
      <div class="stat-number" id="approvedCount">0</div>
      <p>Approved Students</p>
    </div>
    <div class="stat-card">
      <i class="fas fa-newspaper"></i>
      <div class="stat-number" id="newsCount">0</div>
      <p>Total Posts</p>
    </div>
  </div>

  <!-- Tabs -->
  <div class="tabs">
    <button class="tab-btn active" onclick="showSection('registrations')">📋 Registrations</button>
    <button class="tab-btn" onclick="showSection('manageNews')">📰 Manage News</button>
    <button class="tab-btn" onclick="showSection('addNews')">➕ Add News/Event</button>
  </div>

  <!-- Registrations Section -->
  <div id="registrationsSection" class="section active">
    <h2 style="margin-bottom: 1rem;">Student Registrations</h2>
    <div id="registrationsList"></div>
  </div>

  <!-- Manage News Section -->
  <div id="manageNewsSection" class="section">
    <h2 style="margin-bottom: 1rem;">Manage News & Events</h2>
    <div id="newsList"></div>
  </div>

  <!-- Add News Section -->
  <div id="addNewsSection" class="section">
    <div class="form-card">
      <h2 style="margin-bottom: 1.5rem;">➕ Create New Post</h2>
      <form id="newsForm">
        <div class="form-group">
          <label>Post Type *</label>
          <select id="newsType" required>
            <option value="announcement">📢 Announcement / News</option>
            <option value="event">🎉 Event</option>
          </select>
        </div>
        <div class="form-group">
          <label>Title *</label>
          <input type="text" id="newsTitle" required placeholder="Enter post title">
        </div>
        <div class="form-group">
          <label>Image URL (optional)</label>
          <input type="text" id="newsImage" placeholder="https://images.unsplash.com/... or leave empty">
          <small style="color: #888;">Tip: Use Unsplash or Pexels image URLs</small>
        </div>
        <div class="form-group" id="eventDateGroup" style="display: none;">
          <label>Event Date *</label>
          <input type="text" id="eventDate" placeholder="e.g., June 28, 2025">
        </div>
        <div class="form-group" id="eventTimeGroup" style="display: none;">
          <label>Event Time</label>
          <input type="text" id="eventTime" placeholder="e.g., 10:00 AM - 4:00 PM">
        </div>
        <div class="form-group" id="eventLocationGroup" style="display: none;">
          <label>Event Location</label>
          <input type="text" id="eventLocation" placeholder="e.g., British Embassy area, Addis Ababa">
        </div>
        <div class="form-group">
          <label>Short Summary / Excerpt</label>
          <input type="text" id="newsExcerpt" placeholder="Brief description">
        </div>
        <div class="form-group">
          <label>Full Content *</label>
          <textarea id="newsContent" rows="6" placeholder="Write detailed content here..."></textarea>
        </div>
        <button type="submit" class="btn-gold"><i class="fas fa-paper-plane"></i> Publish Post</button>
      </form>
    </div>
  </div>
</div>

<!-- Font Awesome -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">

<script>
  // Check if admin is logged in - if not, redirect to login
  if (localStorage.getItem('egc_admin_logged_in') !== 'true') {
    window.location.href = 'admin-login.html';
  }

  let currentRegistrations = [];
  let currentNews = [];

  // Load all data from localStorage
  function loadData() {
    currentRegistrations = JSON.parse(localStorage.getItem('egc_registrations') || '[]');
    currentNews = JSON.parse(localStorage.getItem('egc_news') || '[]');
    
    // Update stats
    const pending = currentRegistrations.filter(r => r.status === 'pending').length;
    const approved = currentRegistrations.filter(r => r.status === 'approved').length;
    document.getElementById('pendingCount').innerText = pending;
    document.getElementById('approvedCount').innerText = approved;
    document.getElementById('newsCount').innerText = currentNews.length;
    
    renderRegistrations();
    renderNewsList();
  }

  // Render registrations table
  function renderRegistrations() {
    const container = document.getElementById('registrationsList');
    const pending = currentRegistrations.filter(r => r.status === 'pending');
    const approved = currentRegistrations.filter(r => r.status === 'approved');
    
    if (currentRegistrations.length === 0) {
      container.innerHTML = '<div class="alert alert-success">No registrations yet. Students will appear here.</div>';
      return;
    }
    
    container.innerHTML = `
      <h3>⏳ Pending (${pending.length})</h3>
      <table class="data-table">
        <thead><tr><th>Name</th><th>Contact</th><th>Course</th><th>Registered</th><th>Action</th></tr></thead>
        <tbody>
          ${pending.map(r => `
            <tr>
              <td><strong>${escapeHtml(r.fullName)}</strong></td>
              <td>${escapeHtml(r.email)}<br><small>${escapeHtml(r.phone)}</small></td>
              <td>${escapeHtml(r.course)}</td>
              <td>${new Date(r.registeredAt).toLocaleDateString()}</td>
              <td>
                <button class="action-btn btn-approve" onclick="approveRegistration(${r.id})" title="Approve"><i class="fas fa-check-circle"></i></button>
                <button class="action-btn btn-delete" onclick="deleteRegistration(${r.id})" title="Delete"><i class="fas fa-trash"></i></button>
              </td>
            </tr>
          `).join('') || '<tr><td colspan="5">No pending registrations</td></tr>'}
        </tbody>
      </table>
      
      <h3 style="margin-top: 2rem;">✅ Approved (${approved.length})</h3>
      <table class="data-table">
        <thead><tr><th>Name</th><th>Contact</th><th>Course</th><th>Status</th></tr></thead>
        <tbody>
          ${approved.map(r => `
            <tr>
              <td><strong>${escapeHtml(r.fullName)}</strong></td>
              <td>${escapeHtml(r.email)}<br><small>${escapeHtml(r.phone)}</small></td>
              <td>${escapeHtml(r.course)}</td>
              <td><span class="status-approved">✓ Approved</span></td>
            </tr>
          `).join('') || '<tr><td colspan="4">No approved registrations yet</td></tr>'}
        </tbody>
      </table>
    `;
  }

  // Render news list
  function renderNewsList() {
    const container = document.getElementById('newsList');
    if (currentNews.length === 0) {
      container.innerHTML = '<div class="alert alert-success">No news posts yet. Create your first post using the "Add News/Event" tab.</div>';
      return;
    }
    
    container.innerHTML = `
      <table class="data-table">
        <thead><tr><th>Type</th><th>Title</th><th>Date</th><th>Actions</th></tr></thead>
        <tbody>
          ${currentNews.map(n => `
            <tr>
              <td>${n.type === 'event' ? '🎉 Event' : '📢 News'}</td>
              <td><strong>${escapeHtml(n.title)}</strong><br><small>${escapeHtml(n.excerpt || n.content.substring(0, 50))}...</small></td>
              <td>${new Date(n.date).toLocaleDateString()}</td>
              <td>
                <button class="action-btn btn-delete" onclick="deleteNews(${n.id})" title="Delete"><i class="fas fa-trash"></i></button>
              </td>
            </tr>
          `).join('')}
        </tbody>
      </table>
    `;
  }

  // Approve registration
  function approveRegistration(id) {
    currentRegistrations = currentRegistrations.map(r => 
      r.id === id ? {...r, status: 'approved'} : r
    );
    localStorage.setItem('egc_registrations', JSON.stringify(currentRegistrations));
    loadData();
    showAlert('Registration approved successfully!', 'success');
  }

  // Delete registration
  function deleteRegistration(id) {
    if (confirm('Are you sure you want to delete this registration?')) {
      currentRegistrations = currentRegistrations.filter(r => r.id !== id);
      localStorage.setItem('egc_registrations', JSON.stringify(currentRegistrations));
      loadData();
      showAlert('Registration deleted.', 'success');
    }
  }

  // Delete news
  function deleteNews(id) {
    if (confirm('Delete this post?')) {
      currentNews = currentNews.filter(n => n.id !== id);
      localStorage.setItem('egc_news', JSON.stringify(currentNews));
      loadData();
      showAlert('Post deleted successfully.', 'success');
    }
  }

  // Show alert message
  function showAlert(message, type) {
    const alertDiv = document.createElement('div');
    alertDiv.className = `alert alert-${type}`;
    alertDiv.innerHTML = `<i class="fas ${type === 'success' ? 'fa-check-circle' : 'fa-info-circle'}"></i> ${message}`;
    const container = document.querySelector('.container');
    container.insertBefore(alertDiv, container.firstChild);
    setTimeout(() => alertDiv.remove(), 3000);
  }

  // Tab switching
  function showSection(section) {
    document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
    document.getElementById(section + 'Section').classList.add('active');
    
    document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
    event.target.classList.add('active');
  }

  // Escape HTML
  function escapeHtml(str) {
    if (!str) return '';
    return str.replace(/[&<>]/g, function(m) {
      if (m === '&') return '&amp;';
      if (m === '<') return '&lt;';
      if (m === '>') return '&gt;';
      return m;
    });
  }

  // Logout function
  function logout() {
    localStorage.removeItem('egc_admin_logged_in');
    window.location.href = 'admin-login.html';
  }

  // News form submission
  document.getElementById('newsForm').addEventListener('submit', function(e) {
    e.preventDefault();
    
    const isEvent = document.getElementById('newsType').value === 'event';
    
    const newPost = {
      id: Date.now(),
      title: document.getElementById('newsTitle').value,
      type: document.getElementById('newsType').value,
      image: document.getElementById('newsImage').value || null,
      excerpt: document.getElementById('newsExcerpt').value,
      content: document.getElementById('newsContent').value,
      date: new Date().toISOString()
    };
    
    if (isEvent) {
      newPost.eventDate = document.getElementById('eventDate').value;
      newPost.eventTime = document.getElementById('eventTime').value;
      newPost.eventLocation = document.getElementById('eventLocation').value;
    }
    
    let news = JSON.parse(localStorage.getItem('egc_news') || '[]');
    news.push(newPost);
    localStorage.setItem('egc_news', JSON.stringify(news));
    
    showAlert('Post published successfully!', 'success');
    document.getElementById('newsForm').reset();
    loadData();
    
    // Switch to manage news tab
    document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
    document.getElementById('manageNewsSection').classList.add('active');
    document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
    document.querySelectorAll('.tab-btn')[1].classList.add('active');
  });

  // Show/hide event fields based on type
  document.getElementById('newsType').addEventListener('change', function() {
    const isEvent = this.value === 'event';
    document.getElementById('eventDateGroup').style.display = isEvent ? 'block' : 'none';
    document.getElementById('eventTimeGroup').style.display = isEvent ? 'block' : 'none';
    document.getElementById('eventLocationGroup').style.display = isEvent ? 'block' : 'none';
  });

  // Initial load
  loadData();
</script>
</body>
</html>

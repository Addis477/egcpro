<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>EGC Global | News & Updates</title>
  <link rel="stylesheet" href="css/style.css">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600;700&family=Montserrat:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>

<div class="top-bar">
  <div class="logo"><h1>EGC <span style="color:var(--gold);">Global</span></h1><p>TRAINING CENTRE</p></div>
  <div class="desktop-nav">
    <a href="index.html">Home</a><a href="courses.html">Courses</a><a href="about.html">About</a>
    <a href="gallery.html">Gallery</a><a href="news.html" class="active">News</a><a href="register.html" class="register-btn">Register Now</a>
  </div>
  <div class="menu-icon" id="menuToggle"><i class="fas fa-bars"></i></div>
</div>

<div class="nav-overlay" id="navOverlay"></div>
<div class="side-nav" id="sideNav">
  <button class="close-nav" id="closeNavBtn"><i class="fas fa-times"></i></button>
  <div class="side-logo"><h3>EGC <span>Global</span></h3><p>TRAINING CENTRE</p></div>
  <ul><li><a href="index.html"><i class="fas fa-home"></i> Home</a></li><li><a href="courses.html"><i class="fas fa-gem"></i> Courses</a></li><li><a href="news.html"><i class="fas fa-newspaper"></i> News</a></li><li><a href="register.html"><i class="fas fa-user-plus"></i> Register</a></li></ul>
  <div class="side-footer">© 2025 EGC Global</div>
</div>

<section style="padding: 3rem 0;">
  <div class="container">
    <h1 class="section-title">Latest News & Updates</h1>
    <div id="allNewsList" class="grid-2"></div>
  </div>
</section>

<footer><p>© 2025 EGC Global Trading PLC</p></footer>

<script src="js/main.js"></script>
<script>
  function loadAllNews() {
    const news = JSON.parse(localStorage.getItem('egc_news') || '[]');
    const container = document.getElementById('allNewsList');
    if (news.length === 0) {
      container.innerHTML = '<div class="card"><p>No news yet. Check back soon for updates on our grand opening!</p></div>';
      return;
    }
    const sortedNews = [...news].reverse();
    container.innerHTML = sortedNews.map(n => `
      <div class="news-card" style="background: var(--card-bg); border-radius: 20px; overflow: hidden;">
        <div class="news-content">
          <div class="news-date"><i class="far fa-calendar-alt"></i> ${new Date(n.date).toLocaleDateString()}</div>
          <h3 class="news-title">${n.title}</h3>
          <p class="news-excerpt">${n.excerpt || n.content.substring(0, 120)}...</p>
          <a href="news-detail.html?id=${n.id}" style="color: var(--gold); text-decoration: none; display: inline-block; margin-top: 1rem;">Read full story <i class="fas fa-arrow-right"></i></a>
        </div>
      </div>
    `).join('');
  }
  loadAllNews();
</script>
</body>
</html>

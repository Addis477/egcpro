<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>EGC Global | News Detail</title>
  <link rel="stylesheet" href="css/style.css">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600;700&family=Montserrat:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>

<div class="top-bar">
  <div class="logo"><h1>EGC <span style="color:var(--gold);">Global</span></h1><p>TRAINING CENTRE</p></div>
  <div class="desktop-nav">
    <a href="index.html">Home</a><a href="courses.html">Courses</a><a href="news.html">News</a><a href="register.html" class="register-btn">Register Now</a>
  </div>
  <div class="menu-icon" id="menuToggle"><i class="fas fa-bars"></i></div>
</div>

<div class="nav-overlay" id="navOverlay"></div>
<div class="side-nav" id="sideNav">
  <button class="close-nav" id="closeNavBtn"><i class="fas fa-times"></i></button>
  <div class="side-logo"><h3>EGC <span>Global</span></h3><p>TRAINING CENTRE</p></div>
  <ul><li><a href="index.html"><i class="fas fa-home"></i> Home</a></li><li><a href="news.html"><i class="fas fa-newspaper"></i> News</a></li></ul>
  <div class="side-footer">© 2025 EGC Global</div>
</div>

<section style="padding: 3rem 0;">
  <div class="container">
    <div id="newsDetail"></div>
    <a href="news.html" class="btn-outline" style="margin-top: 2rem; display: inline-block;"><i class="fas fa-arrow-left"></i> Back to News</a>
  </div>
</section>

<footer><p>© 2025 EGC Global Trading PLC</p></footer>

<script src="js/main.js"></script>
<script>
  function loadNewsDetail() {
    const urlParams = new URLSearchParams(window.location.search);
    const newsId = parseInt(urlParams.get('id'));
    const news = JSON.parse(localStorage.getItem('egc_news') || '[]');
    const article = news.find(n => n.id === newsId);
    
    const container = document.getElementById('newsDetail');
    if (!article) {
      container.innerHTML = '<div class="alert alert-error">News article not found.</div>';
      return;
    }
    
    container.innerHTML = `
      <div class="card">
        <div class="news-date"><i class="far fa-calendar-alt"></i> ${new Date(article.date).toLocaleDateString()} | <i class="far fa-clock"></i> EGC Global</div>
        <h1 style="font-size: 2.5rem; margin: 1rem 0;">${article.title}</h1>
        <div style="height: 2px; background: linear-gradient(90deg, var(--gold), transparent); margin: 1rem 0 1.5rem 0;"></div>
        <p style="font-size: 1.1rem; line-height: 1.6;">${article.content}</p>
      </div>
    `;
  }
  loadNewsDetail();
</script>
</body>
</html>

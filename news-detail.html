<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>News Detail | EGC Global</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600;700&family=Montserrat:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root { --gold: #d4af5a; --gold-light: #e6c97e; --dark-bg: #0a0c0f; --card-bg: rgba(26,32,38,0.9); --ivory: #f2ede4; }
    body { font-family: 'Montserrat', sans-serif; background: var(--dark-bg); color: var(--ivory); }
    .top-bar { display: flex; justify-content: space-between; align-items: center; padding: 1rem 2rem; background: rgba(10,12,15,0.9); backdrop-filter: blur(12px); position: sticky; top: 0; z-index: 99; border-bottom: 1px solid rgba(212,175,90,0.25); }
    .logo h1 { font-size: 1.6rem; background: linear-gradient(135deg, var(--gold-light), var(--gold)); -webkit-background-clip: text; background-clip: text; color: transparent; }
    .logo p { font-size: 0.65rem; letter-spacing: 2.5px; color: var(--gold); }
    .desktop-nav { display: none; gap: 2rem; align-items: center; }
    .desktop-nav a { color: var(--ivory); text-decoration: none; font-weight: 500; }
    .desktop-nav a:hover { color: var(--gold); }
    .register-btn { background: var(--gold); color: #000 !important; padding: 0.5rem 1.3rem; border-radius: 40px; font-weight: 700 !important; }
    .menu-icon { font-size: 1.8rem; color: var(--gold); cursor: pointer; }
    @media (min-width: 992px) { .menu-icon { display: none; } .desktop-nav { display: flex; } }
    .nav-overlay, .side-nav { display: none; }
    .container { max-width: 900px; margin: 0 auto; padding: 0 2rem; }
    section { padding: 2rem 0 4rem; }
    .news-image { width: 100%; height: 400px; background-size: cover; background-position: center; border-radius: 24px; margin-bottom: 2rem; }
    .event-detail-box { background: rgba(212,175,90,0.12); border-left: 4px solid var(--gold); padding: 1.5rem; border-radius: 16px; margin: 1.5rem 0; }
    .event-info-row { display: flex; align-items: center; gap: 1rem; margin-bottom: 1rem; flex-wrap: wrap; }
    .event-label { font-weight: 700; min-width: 100px; color: var(--gold); }
    .badge-event { display: inline-block; background: var(--gold); color: #000; padding: 0.3rem 1rem; border-radius: 30px; font-size: 0.8rem; font-weight: bold; margin-bottom: 1rem; }
    .btn-gold { background: var(--gold); color: #000; padding: 0.8rem 1.8rem; border: none; border-radius: 40px; font-weight: bold; cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; gap: 8px; }
    .btn-outline { background: transparent; border: 1.5px solid var(--gold); color: var(--gold); padding: 0.8rem 1.8rem; border-radius: 40px; font-weight: 600; text-decoration: none; display: inline-flex; align-items: center; gap: 8px; }
    .content-body { font-size: 1.05rem; line-height: 1.7; color: #ddd; }
    .content-body p { margin-bottom: 1rem; }
    .content-body ul { margin: 1rem 0 1rem 2rem; }
    footer { background: #05080c; text-align: center; padding: 2rem; margin-top: 2rem; }
    @media (max-width: 768px) { .news-image { height: 220px; } .container { padding: 0 1.2rem; } }
  </style>
</head>
<body>

<div class="top-bar">
  <div class="logo"><h1>EGC <span style="color:var(--gold);">Global</span></h1><p>TRAINING CENTRE</p></div>
  <div class="desktop-nav">
    <a href="index.html">Home</a><a href="courses.html">Courses</a><a href="about.html">About</a>
    <a href="gallery.html">Gallery</a><a href="news.html">News</a><a href="register.html" class="register-btn">Register Now</a>
  </div>
  <div class="menu-icon" id="menuToggle"><i class="fas fa-bars"></i></div>
</div>

<section>
  <div class="container">
    <div id="newsDetail"></div>
    <div style="margin-top: 2rem; display: flex; gap: 1rem; flex-wrap: wrap;">
      <a href="news.html" class="btn-outline"><i class="fas fa-arrow-left"></i> Back to News</a>
      <a href="register.html" class="btn-gold"><i class="fas fa-calendar-check"></i> Register for Course</a>
    </div>
  </div>
</section>

<footer><p>© 2025 EGC Global Trading PLC – All Rights Reserved.</p></footer>

<script>
  function getNewsById(id) {
    const allNews = JSON.parse(localStorage.getItem('egc_news') || '[]');
    return allNews.find(n => n.id === id);
  }

  function loadNewsDetail() {
    const urlParams = new URLSearchParams(window.location.search);
    const newsId = parseInt(urlParams.get('id'));
    const article = getNewsById(newsId);
    const container = document.getElementById('newsDetail');
    
    if (!article) {
      container.innerHTML = `<div class="card" style="padding: 3rem; text-align: center;"><h2>Article Not Found</h2><a href="news.html" class="btn-gold" style="margin-top: 1rem;">Browse News</a></div>`;
      return;
    }
    
    const isEvent = article.type === 'event';
    const formattedDate = new Date(article.date).toLocaleDateString('en-US', { year: 'numeric', month: 'long', day: 'numeric' });
    
    container.innerHTML = `
      <div class="badge-event"><i class="${isEvent ? 'fas fa-calendar-check' : 'fas fa-newspaper'}"></i> ${isEvent ? 'UPCOMING EVENT' : 'ANNOUNCEMENT'}</div>
      <div class="news-image" style="background-image: url('${article.image || 'https://placehold.co/1200x500/2c3e50/d4af5a?text=' + encodeURIComponent(article.title)}');"></div>
      <h1 style="font-size: clamp(1.8rem, 5vw, 2.5rem);">${article.title}</h1>
      <div style="margin: 1rem 0; color: #aaa;"><i class="far fa-calendar-alt"></i> ${formattedDate}</div>
      ${isEvent ? `
        <div class="event-detail-box">
          <div class="event-info-row"><i class="fas fa-calendar-alt" style="font-size: 1.5rem; color: var(--gold);"></i><div><span class="event-label">Date & Time:</span> <strong>${article.eventDate || formattedDate}</strong> ${article.eventTime ? `<br>⏰ ${article.eventTime}` : ''}</div></div>
          <div class="event-info-row"><i class="fas fa-map-marker-alt" style="font-size: 1.5rem; color: var(--gold);"></i><div><span class="event-label">Location:</span> <strong>${article.eventLocation || 'Infront of British Embassy, Addis Ababa'}</strong></div></div>
          <div style="margin-top: 1rem;"><a href="register.html" class="btn-gold"><i class="fas fa-user-plus"></i> Register for this Event</a></div>
        </div>
      ` : ''}
      <div class="content-body">${article.content || '<p>Full content coming soon. Stay tuned for more updates from EGC Global Training Centre.</p>'}</div>
    `;
  }
  
  loadNewsDetail();
</script>
</body>
</html>
